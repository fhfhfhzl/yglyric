<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YG LYRIC QUIZ</title><style>
*{box-sizing:border-box}body{margin:0;background:#101010;color:#f5f5f5;font-family:Arial,'Apple SD Gothic Neo',sans-serif}main{max-width:720px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #444;padding-bottom:18px}h1{font-size:clamp(36px,8vw,64px);letter-spacing:-3px;line-height:.98;margin:34px 0 15px}h2{font-size:28px}p,small{color:#aaa;line-height:1.6}button,select,input,textarea{font:inherit}button{cursor:pointer;color:inherit;background:#202020;border:1px solid #444;padding:17px;text-align:left;border-radius:4px}button:hover{border-color:#fff}button:disabled{cursor:default;opacity:.65}.primary{background:#fff;color:#111;font-weight:bold;text-align:center;width:100%}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:20px 0}.grid button{min-height:78px;font-weight:bold;font-size:17px}.grid small{display:block;font-size:10px;font-weight:normal;margin-top:8px;letter-spacing:1px}.bar{height:4px;background:#333;margin:20px 0}.bar i{display:block;height:100%;background:white}.clue{padding:35px 18px;background:#1c1c1c;text-align:center;white-space:pre-wrap;line-height:1.8;font-size:20px;margin:20px 0}.options{display:grid;gap:9px}.correct{background:#16452c!important;border-color:#71c895!important}.wrong{background:#542424!important;border-color:#ee8888!important}.row{display:flex;gap:10px;align-items:center;justify-content:space-between}.muted{font-size:12px;color:#999}select,textarea,input{background:#202020;color:white;border:1px solid #555;padding:12px;width:100%;border-radius:4px}label{display:block;margin:20px 0 8px}footer{border-top:1px solid #333;margin-top:36px;padding-top:18px;font-size:11px;color:#777}article{border-bottom:1px solid #333;padding:14px 0}textarea{min-height:160px}a{color:white}.tag{font-size:11px;letter-spacing:2px;color:#aaa}#notice{border-left:2px solid #888;padding-left:12px}button:focus-visible{outline:2px solid #fff;outline-offset:3px}</style></head><body><main><header><b>YG / LYRIC QUIZ</b><button id="home" style="padding:8px 12px">HOME</button></header><section id="app"></section><footer>UNOFFICIAL FAN PROJECT · NOT AFFILIATED WITH YG ENTERTAINMENT</footer></main><script>
const catalog={BIGBANG:['거짓말','하루하루','마지막 인사','BLUE','LOSER','BAE BAE','뱅뱅뱅','우리 사랑하지 말아요','IF YOU','맨정신','봄여름가을겨울','FANTASTIC BABY'],WINNER:['공허해','컬러링','REALLY REALLY','LOVE ME LOVE ME','MILLIONS','EVERYDAY','ISLAND','AH YEAH','SOSO','I LOVE U','뜸','센치해'],iKON:['사랑을 했다','취향저격','죽겠다','이별길','고무줄다리기','왜왜왜','너란 바람 따라','BUT YOU','딴따라','U'],TREASURE:['BOY','사랑해','음 (MMM)','MY TREASURE','직진','다라리','HELLO','BONA BONA','KING KONG','LAST NIGHT'], '2NE1':['FIRE','I DON’T CARE','내가 제일 잘 나가','UGLY','LONELY','COME BACK HOME','너 아님 안돼','그리워해요','안녕','박수쳐'],BLACKPINK:['휘파람','붐바야','불장난','STAY','마지막처럼','뚜두뚜두','Kill This Love','How You Like That','Lovesick Girls','Pink Venom','Shut Down','JUMP'],BABYMONSTER:['BATTER UP','Stuck In The Middle','SHEESH','LIKE THAT','FOREVER','DRIP','CLIK CLAK','Really Like You','HOT SAUCE'],AKMU:['200%','Give Love','얼음들','시간과 낙엽','RE-BYE','오랜 날 오랜 밤','어떻게 이별까지 사랑하겠어, 널 사랑하는 거지','낙하','Love Lee','후라이의 꿈'], 'EPIK HIGH':['Fly','Paris','Love Love Love','우산','One','춥다','헤픈엔딩','BORN HATER','연애소설','빈차','Rosario','Screen Time'], 'LEE HI':['1,2,3,4','Rose','한숨','손잡아 줘요','MY STAR','누구 없소','홀로','For You','빨간 립스틱','ONLY'],PSY:['새','챔피언','연예인','Right Now','강남스타일','GENTLEMAN','DADDY','나팔바지','New Face','I LUV IT','That That'],SOLO:['삐딱하게','눈, 코, 입','무제(無題)','겁','아낙네','본능적으로','I WANNA BE','SOLO','On The Ground','LALISA','꽃','APT.'], 'UNIT & FAMILY':['HIGH HIGH','OH YEAH','쩔어','GOOD BOY','빨리 전화해','붐벼','나는 달라','ALL I WANT FOR CHRISTMAS IS YOU','멋쟁이 신사','MOVE']};
const samples=[['BIGBANG','하루하루','지나간 사랑을 놓아주려 하지만\n하루씩 견디는 마음이 쉽게 편해지지 않는다.'],['WINNER','REALLY REALLY','상대에게 자신의 호감을 솔직하게 고백하며\n진심이라는 것을 강조하는 밝은 노래.'],['iKON','사랑을 했다','끝난 사랑을 슬픔만으로 기억하지 않고\n함께했던 이야기를 아름다운 추억으로 남긴다.'],['TREASURE','직진','좋아하는 사람을 향한 마음이 멈추지 않고\n망설임 없이 앞으로 향하는 곡.'],['2NE1','내가 제일 잘 나가','다른 사람의 평가에 흔들리지 않고\n자신의 존재감과 자신감을 당당하게 드러낸다.'],['BLACKPINK','Lovesick Girls','사랑 때문에 상처를 입으면서도\n계속해서 사랑을 찾아가는 마음을 노래한다.'],['BABYMONSTER','FOREVER','자유롭고 빛나는 순간을 오래 간직하며\n자신만의 길을 즐기겠다는 분위기의 곡.'],['AKMU','후라이의 꿈','정해진 틀에 맞춰 애쓰지 않아도\n자신의 속도와 방식으로 살아가고 싶은 마음.'],['EPIK HIGH','우산','비 오는 날의 풍경 속에서\n떠나간 사람과 함께한 기억을 떠올린다.'],['LEE HI','한숨','지친 사람의 숨과 고통을 이해하려 하며\n완벽하지 않아도 괜찮다고 위로하는 곡.'],['PSY','강남스타일','낮과 밤의 상반된 매력을 이야기하며\n특정 지역의 이름을 중심으로 흥을 돋운다.'],['SOLO','눈, 코, 입','떠나간 연인의 얼굴과 작은 특징들이\n잊히지 않아 그리워하는 마음을 노래한다.'],['UNIT & FAMILY','GOOD BOY','겉으로 보이는 모습과 실제 매력을 내세우며\n강렬한 비트 위에서 자신감을 표현하는 곡.']].map(([artist,title,clue])=>({artist,title,clue,difficulty:'normal',demo:true}));
const $=s=>document.querySelector(s), app=$('#app');let selected='',mode='demo',queue=[],pos=0,score=0,wrong=[],locked=false;const read=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};let data=read('yg.questions',[]);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function pool(){return mode==='demo'?samples:data}function home(){app.innerHTML=`<div class="tag" style="margin-top:30px">THE MUSIC ARCHIVE</div><h1>KNOW YOUR<br>LYRICS.</h1><p>가사를 읽고 노래 제목을 선택하세요.</p><p id="notice" class="muted">현재 제공되는 시범 문제는 실제 가사가 아닌 곡의 내용 설명입니다. 이용 허락을 받은 가사를 등록하면 실제 가사 모드로 플레이할 수 있습니다.</p><label>플레이 모드</label><select id="mode"><option value="demo">시범 · 곡 설명</option><option value="real">실제 가사</option></select><div class="grid" id="artists"></div><div class="row"><button id="records">기록 보기</button><button id="manage">가사 데이터 관리</button></div>`;$('#mode').value=mode;$('#mode').onchange=e=>{mode=e.target.value;drawArtists()};drawArtists();$('#manage').onclick=manage;$('#records').onclick=records}function drawArtists(){let names=['ALL RANDOM',...Object.keys(catalog)];$('#artists').innerHTML=names.map(a=>`<button data-a="${esc(a)}">${esc(a)}<small>${pool().filter(q=>a==='ALL RANDOM'||q.artist===a).length} QUESTIONS →</small></button>`).join('');$('#artists').querySelectorAll('button').forEach(b=>b.onclick=()=>settings(b.dataset.a))}function settings(a){selected=a;app.innerHTML=`<h2>${esc(a)}</h2><label>문제 수</label><select id="count">${[10,20,30,50,'전체'].map(x=>`<option>${x}</option>`).join('')}</select><label>난이도</label><select id="diff"><option value="all">RANDOM</option><option value="easy">EASY</option><option value="normal">NORMAL</option><option value="hard">HARD</option><option value="expert">EXPERT</option></select><p>제목 4개 중 하나를 선택합니다. 등록된 문제 수가 적으면 가능한 만큼만 출제합니다.</p><button class="primary" id="start">START QUIZ</button><p id="msg"></p>`;$('#start').onclick=()=>{let d=$('#diff').value,c=$('#count').value;let seen=new Set();queue=shuffle(pool().filter(q=>(a==='ALL RANDOM'||q.artist===a)&&(d==='all'||q.difficulty===d))).filter(q=>{let k=q.artist+q.title;if(seen.has(k))return false;seen.add(k);return true}).slice(0,c==='전체'?Infinity:Number(c));if(!queue.length){$('#msg').textContent='해당 조건에 등록된 문제가 없습니다.';return}pos=score=0;wrong=[];question()}}function question(){locked=false;let q=queue[pos];let titles=[...new Set([...(catalog[q.artist]||[]),...data.filter(x=>x.artist===q.artist).map(x=>x.title)])].filter(x=>x!==q.title);let opts=shuffle([q.title,...shuffle(titles).slice(0,3)]);app.innerHTML=`<div class="row" style="margin-top:24px"><b>${esc(q.artist)}</b><span>${pos+1} / ${queue.length}</span></div><div class="bar"><i style="width:${100*(pos+1)/queue.length}%"></i></div><div class="tag">${q.demo?'DEMO · 곡 설명':'LYRIC QUESTION'}</div><div class="clue">${esc(q.clue)}</div><div class="options">${opts.map((x,i)=>`<button data-i="${i}">${String(i+1).padStart(2,'0')}　${esc(x)}</button>`).join('')}</div><p id="feedback" aria-live="polite"></p><button id="next" class="primary" hidden>다음 문제</button><button id="skip" style="margin-top:10px;width:100%;text-align:center">건너뛰기</button>`;let buttons=[...$('.options').children];function answer(i){if(locked)return;locked=true;let ok=opts[i]===q.title;if(ok)score++;else wrong.push({q,chosen:opts[i]||'건너뛰기'});buttons.forEach((b,j)=>{b.disabled=true;if(opts[j]===q.title)b.classList.add('correct');else if(j===i)b.classList.add('wrong')});$('#feedback').textContent=ok?'정답입니다!':'정답: '+q.title;$('#next').hidden=false;$('#skip').hidden=true;$('#next').textContent=pos+1===queue.length?'결과 보기':'다음 문제'}buttons.forEach((b,i)=>b.onclick=()=>answer(i));$('#skip').onclick=()=>answer(-1);$('#next').onclick=()=>{pos++;pos<queue.length?question():result()}}function result(){let history=read('yg.history',[]);history.unshift({artist:selected,score,total:queue.length,mode,date:new Date().toLocaleDateString('ko-KR')});save('yg.history',history.slice(0,100));app.innerHTML=`<h1>${Math.round(score/queue.length*100)}%</h1><p>${esc(selected)} · ${mode==='demo'?'시범':'실제 가사'} · ${score} / ${queue.length} 정답</p><button class="primary" id="again">다시 시작</button><h2>오답 노트</h2>${wrong.length?wrong.map(x=>`<article>${esc(x.q.clue)}<p>선택: ${esc(x.chosen)}<br>정답: ${esc(x.q.title)}</p></article>`).join(''):'모두 맞혔습니다!'}`;$('#again').onclick=()=>settings(selected)}function records(){let h=read('yg.history',[]);app.innerHTML=`<h2>PLAY RECORDS</h2>${h.length?h.map(x=>`<article><b>${esc(x.artist)}</b><p>${x.score}/${x.total} · ${x.mode==='demo'?'시범':'실제 가사'} · ${esc(x.date)}</p></article>`).join(''):'아직 기록이 없습니다.'}`}
function manage(){app.innerHTML=`<h2>가사 데이터 관리</h2><p>이용 권한을 확보한 가사를 직접 등록하세요. 권장 길이 2~4줄. 데이터는 이 브라우저에 저장됩니다.</p><label>아티스트</label><select id="artist">${Object.keys(catalog).map(a=>`<option>${esc(a)}</option>`).join('')}</select><label>곡 제목</label><input id="title" placeholder="정식 곡 제목"><label>가사</label><textarea id="clue" placeholder="가사 2~4줄"></textarea><label>난이도</label><select id="difficulty"><option>easy</option><option selected>normal</option><option>hard</option><option>expert</option></select><p id="len"></p><button class="primary" id="add">문제 등록</button><p id="status" aria-live="polite"></p><div class="row"><button id="export">JSON 내보내기</button><button id="import">JSON 가져오기</button><input type="file" id="file" accept=".json" hidden></div><div id="list"></div>`;$('#clue').oninput=()=>$('#len').textContent=$('#clue').value.length+'자';function render(){ $('#list').innerHTML=data.map((q,i)=>`<article><div class="row"><b>${esc(q.artist)} / ${esc(q.title)}</b><button data-del="${i}">삭제</button></div><p>${esc(q.clue)}</p></article>`).join('');$('#list').querySelectorAll('button').forEach(b=>b.onclick=()=>{data.splice(+b.dataset.del,1);save('yg.questions',data);render()})}$('#add').onclick=()=>{let q={artist:$('#artist').value,title:$('#title').value.trim(),clue:$('#clue').value.trim(),difficulty:$('#difficulty').value};if(!q.title||!q.clue){$('#status').textContent='제목과 가사를 입력하세요.';return}data.push(q);save('yg.questions',data);$('#status').textContent='등록 완료';$('#title').value=$('#clue').value='';render()};$('#export').onclick=()=>{let u=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='lyrics.json';a.click();URL.revokeObjectURL(u)};$('#import').onclick=()=>$('#file').click();$('#file').onchange=async e=>{try{let a=JSON.parse(await e.target.files[0].text());if(!Array.isArray(a)||!a.every(q=>Object.hasOwn(catalog,q.artist)&&typeof q.title==='string'&&q.title.trim()&&typeof q.clue==='string'&&q.clue.trim()&&['easy','normal','hard','expert'].includes(q.difficulty)))throw Error();data.push(...a.map(({artist,title,clue,difficulty})=>({artist,title,clue,difficulty})));save('yg.questions',data);render();$('#status').textContent='가져오기 완료'}catch{$('#status').textContent='올바른 JSON 형식이 아닙니다.'}};render()};$('#home').onclick=home;home();</script></body></html>
